<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Cosmic Test</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Вступительный экран -->
  <div id="intro-screen">
    <div id="intro-title">Which cosmic object are you?</div>
    <button type="button" id="start-btn">START</button>

    <div id="credits">
      <div>Idea by <span>Susanna Bekker</span></div>
      <div>Art by <span>Joseph Murtagh</span></div>
      <div>Built by <span>Igor Sirotin</span></div>
    </div>

    <a id="map-link" href="map.html">See the whole quiz map</a>
  </div>

  <!-- Карточка вопросов -->
  <div class="card" id="question-card" style="display:none;">
    <h1 id="text"></h1>
    <div id="buttons"></div>
  </div>

  <!-- Overlay перед финальным результатом -->
  <div id="final-overlay">You are...</div>

  <!-- Кнопка Restart -->
  <button type="button" id="restart-btn" style="display:none;">Restart</button>
  <script src="data.js"></script>
  <script src="names.js"></script>
  <script src="script.js"></script>

</body>

</html>
